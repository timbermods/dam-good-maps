# Dependabot version updates: weekly, as pull requests into dev (work happens on dev; main only
# takes tagged releases). One pull request per ecosystem per week (Kyler, PLAN §20 D150):
# - GitHub Actions: every update, majors included, merged when CI is green.
# - npm: minor and patch updates, merged when CI is green. CI's byte checks (the fixed sha256s in
#   tests/contract/projects.test.ts and the rest) catch any update that would change a map, fflate
#   included. npm majors are not requested here: they wait for a deliberate upgrade step at a quiet
#   time (for example the refinement phase) with the full nightly suite, found with `npm outdated`.
#
# The root package and collab-worker/ (the collaboration function, with its own lockfile) matter: the package.json files
# under investigation/ belong to finished studies and prototypes that nothing imports (investigation/README.md).
#
# GitHub reads this file from the default branch (main), so it takes effect with the next release.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 2
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # collab-worker/ is deployed on its own (wrangler, workers types); its own lockfile
  - package-ecosystem: npm
    directory: /collab-worker
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 1
    groups:
      collab-worker-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
