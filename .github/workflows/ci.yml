name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

# What runs, by event:
#   pull request into dev    the light set: `changes`, `test` (typecheck, quick suite, build) and the browser shards.
#                            Not while a PR is a draft: marking it ready runs CI. A newer push cancels the run.
#                            One that touches only investigation/ (Codex's investigation PRs) runs `changes` alone.
#   merge group (the queue)  the full suite on the merged state, once per batch of queued PRs, classified by the batch's
#                            change (below). Nothing merges into dev without it. Pushes to dev run no CI; the
#                            nightly (nightly.yml) checks dev's tip every night.
#   push to main, pull request into main (a release), manual run
#                            the full suite, always, and never cancelled.
# No run for other branches or tags. Merge-group runs have their own ref each, so they never cancel one another.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.base_ref == 'dev' }}

# Jobs run side by side: the tests (typecheck and the quick suite), the browser tests in four shards, the
# Python oracle, generation, and the cross-engine determinism check with the Rust build. They fail only on
# breakage. The heaviest checks run nightly (nightly.yml): the long property runs, the full oracle and the
# 100-seed batches.
#
# The `changes` job decides what a run needs (tools/ci-changes.mjs, tests/unit/ci-changes.test.ts). Three classes of
# change, for pull requests into dev and merge groups; main and manual runs run everything:
#   - only documents, investigation/, LICENSE or package.json's descriptive fields (not dependencies, devDependencies,
#     scripts or anything else): `test` runs its two document tests and the build; every other job is skipped; a pull
#     request into dev touching only investigation/ skips `test` too (the nightly and the merge still check it);
#   - only src/editor/, src/ui/ and the browser specs (tests/e2e/), plus documents: `test` and the browser shards run;
#     oracle, generation, engines and rust are skipped;
#   - anything else: all of them, except the Rust checks, which run only when rust/, tools/rust/, the toolchain
#     file, the TypeScript that wraps the Wasm, package.json or this workflow changes.
# A skipped job counts as passed for merge and release (tools/release.sh).
jobs:
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.which.outputs.heavy }}
      suites: ${{ steps.which.outputs.suites }}
      rust: ${{ steps.which.outputs.rust }}
      test: ${{ steps.which.outputs.test }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Which suites does this run need?
        id: which
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          # merge group: by the change; pull request into dev: light; pushes to main, pull requests into main, manual: full
          MODE: ${{ github.event_name == 'merge_group' && 'auto' || github.event_name == 'pull_request' && github.base_ref == 'dev' && 'light' || 'full' }}
        run: node tools/ci-changes.mjs "$BASE" "$HEAD" "--$MODE"

  test:
    needs: changes
    # (skipped for a pull request into dev that touches only investigation/)
    if: needs.changes.outputs.test != 'false'
    runs-on: ubuntu-latest
    # the browser specs alone take about 25 minutes with the forces and Glaciate; 30 cut them off
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: prototype/requirements.txt
      - run: npm ci
      - run: pip install -r prototype/requirements.txt
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and contract tests (the heavy ones run nightly)
        if: needs.changes.outputs.heavy == 'true'
        run: npm run test:quick
      # a documents-only change: just the tests that read documents (retired terms, the sounds' credits)
      - name: Document tests (a change that only touches documents, LICENSE or package.json's descriptive fields)
        if: needs.changes.outputs.heavy != 'true'
        run: npx vitest run --project quick tests/unit/retired-terms.test.ts tests/unit/juiceSounds.test.ts
      - name: Build
        run: npm run build

  # The browser specs run as parallel shards, each on its own runner with its own build (Playwright builds
  # the app itself, twice, in its web server). Every spec runs in exactly one shard (`--shard=i/N`); the
  # split is by file, so the same workflow suits any branch. Raising the shard count is the fix if a
  # branch's specs outgrow the 30 minutes a job gets, never a longer limit.
  browser:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    name: browser (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/playwright
        with:
          browsers: chromium
      - name: Browser tests, shard ${{ matrix.shard }} of 4 (Node and Chromium produce the same bytes)
        run: npx playwright test --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  oracle:
    needs: changes
    if: needs.changes.outputs.suites == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: prototype/requirements.txt
      - run: npm ci
      - run: pip install -r prototype/requirements.txt
      # one seed of each theme at every size; parity at every size (seed k at sizes[k mod 3]).
      # Seeds 1-21, three per theme and Any, run nightly.
      - name: Python oracle (load checks, round trip, validator parity; every theme at every size)
        run: npm run oracle -- --seeds 1,5,9,10,14,18,19 --sizes 96,128,256

  generation:
    needs: changes
    if: needs.changes.outputs.suites == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the batches' canonical settles run in the native Rust water (PLAN §20 D381; tools/rust/native-water.ts)
      - name: Install Rust 1.90 (rust-toolchain.toml) and build the native water
        run: |
          rustup toolchain install
          cd rust && cargo build --release -j 4 -p water --bin water-batch
      # Any and the six themes at once, one process each; 100 seeds each run nightly. A seed that makes no
      # map is breakage (final ≥ 98%, PLAN §20 D145), and every accepted map's project file must
      # reopen to the same bytes; the first-attempt rate is information.
      - name: Pass rates, every theme (20 seeds at 128² Normal, final ≥ 98%; first attempt reported)
        run: |
          mkdir -p .scratch
          pids=()
          for t in any riverValley canyon highlands lakeBasin delta islands; do
            npx tsx tools/batch.ts --seeds 1-20 --size 128 --theme $t --min-first 0 > .scratch/batch-$t.txt 2>&1 &
            pids+=($!)
          done
          fail=0
          for p in "${pids[@]}"; do wait "$p" || fail=1; done
          cat .scratch/batch-*.txt
          { echo "### Pass rates, 20 seeds a theme at 128² (final ≥ 98% blocks; first attempt is information)"; echo; for t in any riverValley canyon highlands lakeBasin delta islands; do sed -n '/ seeds of /,$p' .scratch/batch-$t.txt; echo; done; } >> "$GITHUB_STEP_SUMMARY"
          exit $fail

  # Two checks that share a setup (the dependencies and the three Playwright browsers), each on its own condition.
  #
  # Engines: the same maps, brushes, forces, placements and water in Chromium, Firefox, WebKit and Node, compared
  # bit for bit (PLAN §2.1, §20 D366; tools/determinism/). The short list: every theme, brush and force
  # setting, one generation seed, short sequences. Chromium and Firefox run it twice: on the page's thread and in a
  # worker whose water runs on four threads at every size (the multi-core water, src/core/sim/parallel.ts), the
  # same bytes. The full list runs nightly on the CPU matrix (nightly.yml). The whole-source guard against engine-dependent maths in the core, the workers and the data
  # tools is in the quick suite (tests/unit/portable.test.ts, tools/portable-guard.ts; D401).
  #
  # Rust (PLAN §20 D381, D401, D442): Rust 1.90 and the wasm32 target, pinned by rust-toolchain.toml.
  # The maths guard over the Rust source, its optimized IR, its assembly and its Wasm (no libm, no FMA, no
  # transcendental intrinsics), then rust/portable bit for bit against src/core/math/portable.ts: natively, in
  # Node's WebAssembly and in Chromium, Firefox and WebKit (tools/rust/check.ts). The Rust water, which every
  # job runs (D381): the committed Wasm equals a fresh build; its canonical settle gives the same bytes natively,
  # in Node's WebAssembly and in each engine; and the native settle gives the app's, on one thread and on four
  # (tools/rust/water-identity.ts --threads, 512² included).
  # It runs only when the Rust or what wraps it changes (tools/ci-changes.mjs, isRustInput), and on every full run.
  # The Rust forces (D381, #158): their committed Wasm equals a fresh build, and every force's byte fixtures give
  # the same packed results natively, in Node's WebAssembly and in each engine, each as pinned
  # (tools/rust/forces-jobs.ts, forces-pins.json).
  # The Rust analysis (D391, #157): its committed Wasm equals a fresh build, its frame guards hold, and each
  # kernel's byte fixtures give the same results natively, in Node's WebAssembly and in each engine, each as
  # pinned (tools/rust/analysis-jobs.ts, analysis-pins.json).
  # The Rust checks (D465, #207): their committed Wasm equals a fresh build, their contracts hold, and each
  # validation's byte fixtures give the same report and analysis natively, in Node's WebAssembly and in each
  # engine, each as pinned (tools/rust/checks-jobs.ts, checks-pins.json).
  # The stacked-column water (D448, rust/water's stack modules, no wiring yet): its contracts, and #71's
  # game-verified fixtures natively and in Node's WebAssembly (tools/rust/stack-identity.ts); the determinism
  # check's stacked-water cases compare the engines.
  engines:
    name: engines and rust
    needs: changes
    if: needs.changes.outputs.suites == 'true' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install Rust 1.90 and the wasm32 target (rust-toolchain.toml)
        if: needs.changes.outputs.rust == 'true'
        run: |
          rustup toolchain install
          rustc --version
      - uses: actions/cache@v6
        if: needs.changes.outputs.rust == 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'rust/Cargo.lock', 'rust/.cargo/config.toml') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: npm ci
      - uses: ./.github/actions/playwright
        with:
          browsers: chromium firefox webkit
      - name: The same results in every engine (the short list)
        if: needs.changes.outputs.suites == 'true'
        run: npx tsx tools/determinism/run.ts --smoke --engines chromium,firefox,webkit,node,chromium-threads,firefox-threads
      - name: The committed Rust Wasm (water, forces, analysis and checks) matches a fresh build; the native batch binaries
        if: needs.changes.outputs.rust == 'true'
        run: npx tsx tools/rust/build.ts --check --native
      - name: Stacked water core contracts, the analysis' frame guards and the checks' contracts (at most four workers)
        if: needs.changes.outputs.rust == 'true'
        run: cd rust && cargo test -j 4 -p water -p analysis -p checks --target-dir target/stack-tests -- --test-threads=4
      - name: Stacked water against the game-verified goldens, native and Node-Wasm
        if: needs.changes.outputs.rust == 'true'
        run: |
          cd rust && cargo build --release -j 4 -p water --example stack-fixture
          cd .. && npx tsx tools/rust/stack-identity.ts
      - name: The native Rust settle gives the app's bytes, on one thread and on four (golden fixtures under both rules, every theme, stored water, 96² to 512²)
        if: needs.changes.outputs.rust == 'true'
        run: npx tsx tools/rust/water-identity.ts --seeds 1-1 --require-native --threads 4 --sizes 96,128,256,512
      - name: The Rust maths guard, strict builds, the same bits as portable.ts, the same water, forces, analysis and checks in every engine
        if: needs.changes.outputs.rust == 'true'
        run: npx tsx tools/rust/check.ts --engines
      - uses: actions/upload-artifact@v7
        if: failure() && needs.changes.outputs.suites == 'true'
        with:
          name: determinism-smoke
          path: .scratch/determinism/smoke/*.json
          if-no-files-found: ignore
          retention-days: 7
      # (a fresh Wasm that differs from the committed one, to compare)
      - uses: actions/upload-artifact@v7
        if: failure() && needs.changes.outputs.rust == 'true'
        with:
          name: rust-wasm
          path: rust/target/embed/wasm32-unknown-unknown/release/*.wasm
          if-no-files-found: ignore
          retention-days: 7
