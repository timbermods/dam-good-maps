name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Jobs run side by side: the tests (typecheck and the quick suite), the browser tests in four shards, the
# Python oracle, generation, and the cross-engine determinism check. They fail only on
# breakage. Timings are information, not gates: each job's summary lists them against their
# budgets, with a warning for any over (tools/timings.ts). The heaviest checks run nightly
# (nightly.yml): the long property runs, the full oracle and the 100-seed batches.
#
# A change that only touches documents, LICENSE or package.json's descriptive fields (not dependencies,
# devDependencies, scripts or anything else) skips the heavy jobs (browser, oracle, generation, engines) and
# finishes in minutes: the `changes` job decides (tools/ci-changes.mjs, tests/unit/ci-changes.test.ts). A
# skipped job counts as passed for merge and release (tools/release.sh). Any other change, a manual run, or a
# change it can't compare keeps the full suite, unchanged. `test` always runs: the typecheck and the build, then
# the whole quick suite, or for such a change only the two tests that read documents.
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.which.outputs.heavy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Do the heavy suites need to run?
        id: which
        run: node tools/ci-changes.mjs "${{ github.event.pull_request.base.sha || github.event.before }}" "${{ github.event.pull_request.head.sha || github.sha }}"

  test:
    needs: changes
    runs-on: ubuntu-latest
    # the browser specs alone take about 25 minutes with the forces and Glaciate; 30 cut them off
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: prototype/requirements.txt
      - run: npm ci
      - run: pip install -r prototype/requirements.txt
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and contract tests (the heavy ones run nightly)
        if: needs.changes.outputs.heavy == 'true'
        run: npm run test:quick
      # a documents-only change: just the tests that read documents (retired terms, the sounds' credits)
      - name: Document tests (a change that only touches documents, LICENSE or package.json's descriptive fields)
        if: needs.changes.outputs.heavy != 'true'
        run: npx vitest run --project quick tests/unit/retired-terms.test.ts tests/unit/juiceSounds.test.ts
      - name: Build
        run: npm run build

  # The browser specs run as parallel shards, each on its own runner with its own build (Playwright builds
  # the app itself, twice, in its web server). Every spec runs in exactly one shard (`--shard=i/N`); the
  # split is by file, so the same workflow suits any branch. Raising the shard count is the fix if a
  # branch's specs outgrow the 30 minutes a job gets, never a longer limit.
  browser:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    name: browser (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Browser tests, shard ${{ matrix.shard }} of 4 (Node and Chromium produce the same bytes)
        run: npx playwright test --shard=${{ matrix.shard }}/4
        env:
          DGM_TIMINGS: .scratch/timings/e2e.jsonl
      - name: Timings (information, not gates)
        if: always()
        run: npx tsx tools/ci-timings.ts .scratch/timings/e2e.jsonl --title "Browser timings, shard ${{ matrix.shard }} of 4"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: timings-browser-${{ matrix.shard }}
          path: .scratch/timings/
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  oracle:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: prototype/requirements.txt
      - run: npm ci
      - run: pip install -r prototype/requirements.txt
      # one seed of each theme at every size; parity at every size (seed k at sizes[k mod 3]).
      # Seeds 1-21, three per theme and Any, run nightly.
      - name: Python oracle (load checks, round trip, validator parity; every theme at every size)
        run: npm run oracle -- --seeds 1,5,9,10,14,18,19 --sizes 96,128,256

  generation:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DGM_TIMINGS: .scratch/timings/generation.jsonl
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generation time (128², budget 3 s; reported)
        run: npm run bench -- --info
      - name: Water settle time (256², budget 3 s, PLAN §10; reported)
        run: npm run bench:water -- --info
      # Any and the six themes at once, one process each; 100 seeds each run nightly. A seed that makes no
      # map is breakage (final ≥ 98%, PLAN §20 D145), and every accepted map's project file must
      # reopen to the same bytes; the first-attempt rate is information.
      - name: Pass rates, every theme (20 seeds at 128² Normal, final ≥ 98%; first attempt reported)
        run: |
          mkdir -p .scratch
          pids=()
          for t in any riverValley canyon highlands lakeBasin delta islands; do
            npx tsx tools/batch.ts --seeds 1-20 --size 128 --theme $t --min-first 0 > .scratch/batch-$t.txt 2>&1 &
            pids+=($!)
          done
          fail=0
          for p in "${pids[@]}"; do wait "$p" || fail=1; done
          cat .scratch/batch-*.txt
          { echo "### Pass rates, 20 seeds a theme at 128² (final ≥ 98% blocks; first attempt is information)"; echo; for t in any riverValley canyon highlands lakeBasin delta islands; do sed -n '/ seeds of /,$p' .scratch/batch-$t.txt; echo; done; } >> "$GITHUB_STEP_SUMMARY"
          exit $fail
      - name: Timings (information, not gates)
        if: always()
        run: npx tsx tools/ci-timings.ts .scratch/timings/generation.jsonl --title "Generation timings"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: timings-generation
          path: .scratch/timings/
          if-no-files-found: ignore
          retention-days: 30

  # The same maps, brushes, forces, placements and water in Chromium, Firefox, WebKit and Node, compared
  # bit for bit (PLAN §2.1, §20 D366; tools/determinism/). The short list: every theme, brush and force
  # setting, one generation seed, short sequences. The full list runs nightly on the CPU matrix
  # (nightly.yml). The guard against native approximate maths in the core is in the quick suite
  # (tests/unit/portable.test.ts).
  engines:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium, Firefox and WebKit for Playwright
        run: npx playwright install --with-deps chromium firefox webkit
      - name: The same results in every engine (the short list)
        run: npx tsx tools/determinism/run.ts --smoke
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: determinism-smoke
          path: .scratch/determinism/smoke/*.json
          retention-days: 7
