name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Three jobs run side by side: the tests, the Python oracle, and generation. They fail only on
# breakage. Timings are information, not gates: each job's summary lists them against their
# budgets, with a warning for any over (tools/timings.ts). The heaviest checks run nightly
# (nightly.yml): the long property runs, the full oracle and the 100-seed batches.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: prototype/requirements.txt
      - run: npm ci
      - run: pip install -r prototype/requirements.txt
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and contract tests (the heavy ones run nightly)
        run: npm run test:quick
      - name: Build
        run: npm run build
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Browser tests (Node and Chromium produce the same bytes)
        run: npm run test:e2e
        env:
          DGM_TIMINGS: .scratch/timings/e2e.jsonl
      - name: Timings (information, not gates)
        if: always()
        run: npx tsx tools/ci-timings.ts .scratch/timings/e2e.jsonl --title "Browser timings"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: timings-browser
          path: .scratch/timings/
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: prototype/requirements.txt
      - run: npm ci
      - run: pip install -r prototype/requirements.txt
      # one seed of each theme at every size; parity at every size (seed k at sizes[k mod 3]).
      # Seeds 1-21, three per theme and Any, run nightly.
      - name: Python oracle (load checks, round trip, validator parity; every theme at every size)
        run: npm run oracle -- --seeds 1,5,9,10,14,18,19 --sizes 96,128,256

  generation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DGM_TIMINGS: .scratch/timings/generation.jsonl
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generation time (128², budget 3 s; reported)
        run: npm run bench -- --info
      - name: Water settle time (256², budget 3 s, PLAN §10; reported)
        run: npm run bench:water -- --info
      # Any and the six themes at once, one process each; 100 seeds each run nightly. A seed that makes no
      # map is breakage (final ≥ 98%, PLAN §20 D145), and every accepted map's project file must
      # reopen to the same bytes; the first-attempt rate is information.
      - name: Pass rates, every theme (20 seeds at 128² Normal, final ≥ 98%; first attempt reported)
        run: |
          mkdir -p .scratch
          pids=()
          for t in any riverValley canyon highlands lakeBasin delta islands; do
            npx tsx tools/batch.ts --seeds 1-20 --size 128 --theme $t --min-first 0 > .scratch/batch-$t.txt 2>&1 &
            pids+=($!)
          done
          fail=0
          for p in "${pids[@]}"; do wait "$p" || fail=1; done
          cat .scratch/batch-*.txt
          { echo "### Pass rates, 20 seeds a theme at 128² (final ≥ 98% blocks; first attempt is information)"; echo; for t in any riverValley canyon highlands lakeBasin delta islands; do sed -n '/ seeds of /,$p' .scratch/batch-$t.txt; echo; done; } >> "$GITHUB_STEP_SUMMARY"
          exit $fail
      - name: Timings (information, not gates)
        if: always()
        run: npx tsx tools/ci-timings.ts .scratch/timings/generation.jsonl --title "Generation timings"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: timings-generation
          path: .scratch/timings/
          if-no-files-found: ignore
          retention-days: 30
