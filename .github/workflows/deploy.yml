name: Deploy to GitHub Pages

# Publishes the site at https://timbermods.github.io/dam-good-maps/ from main.
# Needs Settings → Pages → Build and deployment → Source: "GitHub Actions".
#
# A preview build can ride along at https://timbermods.github.io/dam-good-maps/preview/: set the
# workflow input preview_ref (a run by hand) or the repository variable DGM_PREVIEW_REF to a branch
# of this repository, and that branch is built with the base /dam-good-maps/preview/ and published
# under dist/preview/, noindex like the rest. The main site is built from main as always, and the
# live check never looks at /preview/. A build with a preview also writes dist/preview/ref.txt
# ("<branch> <commit>"), which roadmap-sync.yml reads to republish that same preview.
#
# The roadmap canvas (tools/roadmap-canvas/index.html) rides along at /roadmap/, taken from dev
# (not main, so it never waits for a release) and always noindex. roadmap-sync.yml, on dev, runs
# this workflow again whenever dev's copy changes.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      preview_ref:
        description: A branch (or a full commit of one) of this repository to publish at /dam-good-maps/preview/ (empty for none)
        type: string
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Python for the first-visit maps' load checks (prototype/validate.py)
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: prototype/requirements.txt
      - run: npm ci
      - run: pip install -r prototype/requirements.txt
      - run: npm run typecheck
      - run: npm test -- tests/unit
      # The first-visit maps (PLAN §20 D330, D343): built here, never committed, and checked like a
      # release (the generator's checks, the validator's export profile, the starting-logs floor,
      # the outcomes where the generator has them, reopening, the Python load checks). Any failure
      # stops the deploy.
      - name: First-visit maps
        run: npx tsx tools/first-visit-maps.ts
      - name: Build
        run: npm run build
        env:
          DGM_BASE: /dam-good-maps/
      # the preview build: a branch of this repository, under /preview/ (none unless one is named)
      - name: Which branch to preview
        id: preview
        env:
          PREVIEW_REF: ${{ inputs.preview_ref || vars.DGM_PREVIEW_REF }}
        run: |
          if [ -z "$PREVIEW_REF" ]; then
            echo "No preview branch."
            exit 0
          fi
          if ! printf '%s' "$PREVIEW_REF" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
            echo "::error::preview_ref must be a branch name"
            exit 1
          fi
          # a full commit: roadmap-sync.yml republishes the exact commit that is live
          if printf '%s' "$PREVIEW_REF" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "ref=$PREVIEW_REF" >> "$GITHUB_OUTPUT"
            echo "Previewing commit $PREVIEW_REF at /dam-good-maps/preview/"
            exit 0
          fi
          if ! git ls-remote --exit-code --heads origin "refs/heads/$PREVIEW_REF" > /dev/null; then
            echo "::error::$PREVIEW_REF is not a branch of this repository"
            exit 1
          fi
          echo "ref=refs/heads/$PREVIEW_REF" >> "$GITHUB_OUTPUT"
          echo "Previewing $PREVIEW_REF at /dam-good-maps/preview/"
      - uses: actions/checkout@v7
        if: steps.preview.outputs.ref != ''
        with:
          ref: ${{ steps.preview.outputs.ref }}
          path: preview-src
          persist-credentials: false
      - name: Build the preview
        if: steps.preview.outputs.ref != ''
        working-directory: preview-src
        run: |
          npm ci
          # the branch's own first-visit maps, checked the same way (a branch without the script has none)
          if [ -f tools/first-visit-maps.ts ]; then npx tsx tools/first-visit-maps.ts; fi
          npx vite build --outDir ../dist/preview --emptyOutDir
          echo "$PREVIEW_REF $(git rev-parse HEAD)" > ../dist/preview/ref.txt
        env:
          DGM_BASE: /dam-good-maps/preview/
          PREVIEW_REF: ${{ inputs.preview_ref || vars.DGM_PREVIEW_REF }}
      # the roadmap canvas, from dev, at /roadmap/: one page that reads everything live, so the file
      # is all there is. Always noindex, public or not. Skipped quietly while dev has no copy.
      - name: Add the roadmap canvas from dev
        run: |
          git fetch --depth 1 origin dev
          if ! git cat-file -e origin/dev:tools/roadmap-canvas/index.html 2> /dev/null; then
            echo "dev has no roadmap canvas yet."
            exit 0
          fi
          mkdir -p dist/roadmap
          git show origin/dev:tools/roadmap-canvas/index.html > dist/roadmap/index.html
          node --input-type=module - <<'EOF'
          import { readFileSync, writeFileSync } from "node:fs";
          const path = "dist/roadmap/index.html";
          const html = readFileSync(path, "utf8");
          if (/<meta[^>]*name=["']robots["'][^>]*content=["'][^"']*noindex/i.test(html)) process.exit(0);
          const out = html.replace(/<head[^>]*>/i, (m) => `${m}\n    <meta name="robots" content="noindex, nofollow">`);
          if (out === html) throw new Error(`${path} has no <head>`);
          writeFileSync(path, out);
          console.log(`noindex, nofollow: ${path}`);
          EOF
      # The site is not public yet: search engines are asked not to index it until the repository
      # variable DGM_PUBLIC is "true" (at launch). Keep this step when changing this workflow.
      - name: Mark every page noindex (not public yet)
        if: vars.DGM_PUBLIC != 'true'
        run: |
          node --input-type=module - <<'EOF'
          import { readdirSync, readFileSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          const tag = '<meta name="robots" content="noindex">';
          const files = readdirSync("dist", { recursive: true }).filter((f) => f.endsWith(".html"));
          if (!files.length) throw new Error("no HTML files in dist");
          for (const f of files) {
            const path = join("dist", f);
            const html = readFileSync(path, "utf8");
            if (/<meta[^>]*name=["']robots["'][^>]*content=["'][^"']*noindex/i.test(html)) continue; // /roadmap/ carries its own
            const out = html.replace(/<head[^>]*>/i, (m) => `${m}\n    ${tag}`);
            if (out === html) throw new Error(`${path} has no <head>`);
            writeFileSync(path, out);
            console.log(`noindex: ${path}`);
          }
          EOF
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # the live check, against the commit this run deployed (CLAUDE.md, Deploying)
  live-check:
    needs: deploy
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/live-check.yml
    with:
      ref: ${{ github.sha }}
