name: Collaboration connection

# The connection test for collaborative editing (D486): the room-code function under `wrangler dev`, a local TURN
# relay and two separate browser processes (Chromium and Firefox), relay-only, with messages, a killed peer, a
# reconnect and a renewed relay login, and the session layer on top of it: the app's own worker with a generated map in
# each browser, edits, claims, a drop and a rejoin (tests/collab, playwright.collab.config.ts). Runs after a merge into dev that
# touches the connection, on a release, nightly and by hand. Does not deploy anything and has no secrets. The test against the deployed function
# is collab-live.yml.

on:
  # (after the merge, on dev's tip, and on a release; a pull request into dev doesn't wait for it, Kyler 2026-10-15)
  push:
    branches: [dev]
    paths:
      - "collab-worker/**"
      - "src/collab/**"
      - "src/core/collab/**"
      - "src/worker/collab.ts"
      - "src/worker/session.ts"
      - "src/worker/generator.worker.ts"
      - "src/worker/collabEdit.ts"
      - "src/editor/collab/**"
      - "src/ui/App.tsx"
      - "tests/collab/**"
      - "tests/unit/collab*.test.ts"
      - "playwright.collab.config.ts"
      - ".github/workflows/collab.yml"
  pull_request:
    branches: [main]
    paths:
      - "collab-worker/**"
      - "src/collab/**"
      - "src/core/collab/**"
      - "src/worker/collab.ts"
      - "src/worker/session.ts"
      - "src/worker/generator.worker.ts"
      - "src/worker/collabEdit.ts"
      - "src/editor/collab/**"
      - "src/ui/App.tsx"
      - "tests/collab/**"
      - "tests/unit/collab*.test.ts"
      - "playwright.collab.config.ts"
      - ".github/workflows/collab.yml"
  schedule:
    - cron: "40 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collab-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  connection:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            collab-worker/package-lock.json
      - run: npm ci
      - run: npm ci --prefix collab-worker
      - run: npm run typecheck --prefix collab-worker
      - run: npx vitest run --project quick tests/unit/collab
      - name: Install Chromium and Firefox for Playwright
        run: npx playwright install --with-deps chromium firefox
      - name: Connection test
        run: npx playwright test -c playwright.collab.config.ts
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: collab-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
