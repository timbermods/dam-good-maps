name: Probe tests

# The DGM Probe runner's own tests (investigation/probe/runner/test.ts; a stand-in game, no Timberborn; Windows only: it
# uses reg.exe, tasklist and taskkill): the catalog's
# maps, the plans, the checks' arithmetic. They generate every map the catalog plays, so they take a few minutes: too
# slow for every pull request, so they run every night on dev's tip, by hand, and on a pull request that changes the
# probe or this file. A failure opens an issue labelled "nightly" (the same one the nightly checks use).
# GitHub runs schedules from the default branch (main).

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - investigation/probe/**
      - .github/workflows/probe.yml

permissions:
  contents: read

concurrency:
  group: probe-${{ github.ref }}
  cancel-in-progress: true

env:
  CHECK_REF: ${{ github.event_name == 'schedule' && 'dev' || '' }}

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECK_REF }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix investigation/probe ci
      - name: Typecheck the runner
        run: npm --prefix investigation/probe run typecheck
      - name: The runner's own tests
        run: npm --prefix investigation/probe test

  issue:
    needs: probe
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CHECKED: ${{ env.CHECK_REF || github.ref_name }}
        run: |
          gh label create nightly --color FBCA04 --description "The nightly checks (nightly.yml)" 2>/dev/null || true
          body="The probe tests failed on $CHECKED: $RUN_URL"
          open=$(gh issue list --label nightly --state open --json number,title --jq 'map(select(.title == "Probe tests failed"))[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "Probe tests failed" --label nightly --body "$body"
          fi
