name: CodeQL

# Code scanning for the JavaScript and TypeScript (the app, its workers, the artifact spike, the
# tools and the tests) and for the workflows themselves: on pushes to dev and
# main, and weekly. The alerts are in the repository's Security tab → Code scanning. It reads the
# code only; it changes no map.

on:
  push:
    branches: [dev, main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # the investigations are studies and prototypes, not product code (investigation/README.md)
          config: |
            paths-ignore:
              - investigation
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
