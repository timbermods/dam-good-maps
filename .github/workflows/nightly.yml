name: Nightly

# The heaviest checks, too slow for every push: the long property runs, the settings batch and the
# settings panel's extremes, each of which must make a map (D471; vitest's "heavy" project,
# vitest.config.ts, tests/contract/everySetting.ts), the full Python oracle, the full cross-engine
# determinism list on each CPU and OS of the matrix, and the 100-seed pass-rate
# batches (final ≥ 98%: a seed that makes no map is breakage, PLAN §20 D145; the first-attempt
# rate is information, against its 60% target), the intention list (a theme a job), Real places' data matching a fresh build, and the
# first-visit maps as the deploy builds them (tools/first-visit-maps.ts, which no other run builds:
# the deploy of high-look-fix-done stopped there, #652). Runs
# every night on dev's tip, by hand (gh workflow run nightly.yml --ref dev), and on a pull request
# that changes this file. A failure of the nightly or hand-started run opens an issue labelled
# "nightly", or comments on the open one.
#
# GitHub runs schedules from the default branch (main), so the schedule starts once this file is
# on main; it then checks dev, where work happens.

on:
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/nightly.yml

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  # the schedule checks dev; a run by hand or on a pull request checks its own ref
  CHECK_REF: ${{ github.event_name == 'schedule' && 'dev' || '' }}

jobs:
  heavy-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECK_REF }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: prototype/requirements.txt
      - run: npm ci
      - run: pip install -r prototype/requirements.txt
      - name: Long property runs, the settings batch and every setting's extremes (D471)
        run: npm run test:heavy

  # The intention list (src/core/land/intentionTable.ts) is the generator's: each intention asked of the theme on seeds
  # 1-12 at 128², a theme a job (about 264 maps each). Here only, never on a pull request or in the release gate
  # (planning). Red means the list moved: regenerate it (npm run intentions) in a pull request that says which intention
  # moved and why.
  intentions:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        theme: [riverValley, canyon, highlands, lakeBasin, delta, islands]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECK_REF }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The intention list on ${{ matrix.theme }} is the generator's
        run: npm run intentions -- --check --theme ${{ matrix.theme }}

  # Real places' data matches a fresh build, in five shards, each on its own runner (`--check --shard i/5`,
  # tools/lib/placeShards.ts: the places dealt out biggest first, so each shard gets three or four of the sixteen 256² maps and
  # its share of the rest; every place in exactly one shard). Each shard compares its places' data, cards and index entries
  # with the committed ones, and checks the whole set's index and files from what is committed (no build), so the five
  # together say what one full `--check` says. The build searches each place's start spots and springs (D245, D521,
  # tools/real-places.ts), each candidate a full build and settle: one job took 23.5 min when it was written
  # (2026-10-25), 5.6 min once its places ran one process a core (#1105), then 54 to 90 min once the springs were
  # searched on every place (#1149, 2026-11-14), past its 90 on the slower runners. A shard is the slowest place it
  # holds (Waimakariri River, 16 to 29 min by the runner) or a fifth of the rest, so each takes about 13 to 30 min.
  # Raising the shard count is the fix if the rest outgrows them; the slowest place sets the floor. Never a longer limit.
  places:
    name: places (${{ matrix.shard }}/5)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECK_REF }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Real places match a fresh build, shard ${{ matrix.shard }} of 5 (public/real-places, tools/real-places.ts)
        run: |
          npm run places -- --check --shard ${{ matrix.shard }}/5 || { echo "::error::The Real places data is stale: run npm run places and commit"; exit 1; }

  oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECK_REF }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: prototype/requirements.txt
      - run: npm ci
      - run: pip install -r prototype/requirements.txt
      - name: Python oracle (load checks, round trip, validator parity; seeds 1-21, every theme and Any)
        run: npm run oracle -- --seeds 1-21 --sizes 96,128,256
      - name: First-visit maps, as the deploy builds them (one per theme, each through the Python load checks)
        run: npx tsx tools/first-visit-maps.ts

  batches:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECK_REF }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the batches' canonical settles run in the native Rust water (PLAN §20 D381; tools/rust/native-water.ts)
      - name: Install Rust 1.90 (rust-toolchain.toml) and build the native water
        run: |
          rustup toolchain install
          cd rust && cargo build --release -j 4 -p water --bin water-batch
      # Any and the six themes at once, one process each (the other sizes and difficulties run locally,
      # docs/progress.md)
      - name: Pass rates, every theme (100 seeds at 128² Normal, final ≥ 98%; first attempt reported)
        run: |
          mkdir -p .scratch
          pids=()
          for t in any riverValley canyon highlands lakeBasin delta islands; do
            npx tsx tools/batch.ts --seeds 1-100 --size 128 --theme $t --min-first 0 > .scratch/batch-$t.txt 2>&1 &
            pids+=($!)
          done
          fail=0
          for p in "${pids[@]}"; do wait "$p" || fail=1; done
          cat .scratch/batch-*.txt
          { echo "### Pass rates, 100 seeds a theme at 128²"; echo; for t in any riverValley canyon highlands lakeBasin delta islands; do sed -n '/ seeds of /,$p' .scratch/batch-$t.txt; echo; done; } >> "$GITHUB_STEP_SUMMARY"
          exit $fail

  # The full determinism list (tools/determinism/, D366) in Chromium, Firefox, WebKit and Node, on each
  # CPU and OS GitHub hosts for this public repository: Linux x64 and ARM64, Windows x64, macOS ARM64.
  # "Available" means a hosted runner label the repository can use; a label GitHub retires or stops
  # offering is dropped from the matrix (and said in docs/STATUS.md), never replaced by a self-hosted
  # machine. Every host must agree with itself across engines, then with the others (hosts, below).
  determinism:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECK_REF }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium, Firefox and WebKit for Playwright
        run: npx playwright install --with-deps chromium firefox webkit
      # (a pull request that changes this file runs the short list, to check the workflow)
      - name: The same results in every engine (the full list)
        run: npx tsx tools/determinism/run.ts --out nightly ${{ github.event_name == 'pull_request' && '--smoke' || '' }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: determinism-${{ matrix.os }}
          path: .scratch/determinism/nightly/*.json
          retention-days: 7

  hosts:
    needs: determinism
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECK_REF }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          path: .scratch/hosts
          pattern: determinism-*
      - name: The same results on every CPU and OS
        run: npx tsx tools/determinism/compare.ts .scratch/hosts/determinism-*

  issue:
    needs: [heavy-tests, intentions, places, oracle, batches, determinism, hosts]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Open an issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CHECKED: ${{ env.CHECK_REF || github.ref_name }}
        run: |
          gh label create nightly --color FBCA04 --description "The nightly checks (nightly.yml)" 2>/dev/null || true
          body="The nightly checks failed on $CHECKED: $RUN_URL"
          open=$(gh issue list --label nightly --state open --json number,title --jq 'map(select(.title == "Nightly checks failed"))[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "Nightly checks failed" --label nightly --body "$body"
          fi
