<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Roadmap</title>
<style>
  :root {
    --bg: #f6f3ee; --panel: #ffffff; --ink: #1f2328; --muted: #5f6b7a; --line: #e3ddd3; --accent: #b4642b; --accent-ink: #fff;
    --shadow: 0 1px 2px rgba(20, 15, 10, .06), 0 6px 18px rgba(20, 15, 10, .06);
    --released: #2f8f5b; --on-dev: #3b9f8a; --in-flight: #d9822b; --planned: #5b6fa8; --ongoing: #7a8594; --parked: #8b7aa8; --deferred: #8b7aa8; --later: #9aa3ad;
    --radius: 10px; font-size: 15px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #171a1f; --panel: #1f242b; --ink: #e7e4de; --muted: #9aa3ad; --line: #2e353e; --accent: #e0945a; --accent-ink: #1a1a1a; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); }
  }
  :root[data-theme="dark"] { --bg: #171a1f; --panel: #1f242b; --ink: #e7e4de; --muted: #9aa3ad; --line: #2e353e; --accent: #e0945a; --accent-ink: #1a1a1a; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.4; display: flex; flex-direction: column; min-height: 100vh; }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 12px 16px 0; }
  header h1 { font-size: 1.15rem; margin: 0; font-weight: 650; letter-spacing: .01em; }
  header .meta { color: var(--muted); font-size: .8rem; }
  .tabs { display: flex; gap: 2px; flex-wrap: wrap; }
  .tabs button { padding: 7px 12px; border-radius: 8px 8px 0 0; color: var(--muted); border-bottom: 2px solid transparent; }
  .tabs button:hover { color: var(--ink); }
  .tabs button.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  .tools { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .tools input { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); width: 240px; }
  .btn { padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); font-size: .85rem; }
  .btn:hover { border-color: var(--accent); }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 16px 0; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 12px; min-width: 96px; }
  .stat b { display: block; font-size: 1.25rem; font-weight: 650; line-height: 1.2; }
  .stat span { color: var(--muted); font-size: .75rem; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 16px 0; align-items: center; font-size: .8rem; color: var(--muted); }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); font-size: .78rem; color: var(--ink); }
  .chip.off { opacity: .45; }
  .chip .dot, .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: var(--c, #888); flex: none; }
  main { flex: 1; padding: 14px 16px 24px; min-height: 0; }
  main.dimmed { padding: 0; }
  .hint { color: var(--muted); font-size: .85rem; margin: 0 0 10px; }
  .hint code, code { font-family: ui-monospace, Consolas, monospace; font-size: .9em; background: color-mix(in srgb, var(--line) 50%, transparent); padding: 1px 5px; border-radius: 4px; }

  /* Board */
  .board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(230px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 8px; align-items: start; }
  .col { background: color-mix(in srgb, var(--panel) 55%, var(--bg)); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; min-height: 120px; }
  .col h2 { font-size: .9rem; margin: 0 0 2px; display: flex; align-items: center; gap: 8px; }
  .col h2 .n { color: var(--muted); font-weight: 500; }
  .col p.hint { font-size: .75rem; margin-bottom: 10px; }
  .card { width: 100%; text-align: left; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--lane, #888); border-radius: 8px; padding: 9px 10px; margin-bottom: 8px; box-shadow: var(--shadow); display: block; transition: transform .08s; }
  .card:hover { transform: translateY(-1px); border-color: var(--accent); border-left-color: var(--lane); }
  .card.sel { outline: 2px solid var(--accent); }
  .card.faded { opacity: .3; }
  .card .t { font-weight: 600; font-size: .9rem; line-height: 1.3; }
  .card .s { color: var(--muted); font-size: .78rem; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .m { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; font-size: .72rem; color: var(--muted); }
  .tag { background: color-mix(in srgb, var(--line) 60%, transparent); padding: 1px 6px; border-radius: 5px; white-space: nowrap; }
  .tag.pr { font-variant-numeric: tabular-nums; }
  .pr-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 3px; vertical-align: 1px; }
  .pr-OPEN { background: #3fa34d; } .pr-MERGED { background: #8250df; } .pr-CLOSED { background: #c33; } .pr-draft { background: #999; } .pr- { background: #bbb; }

  /* Order */
  .order { max-width: 1100px; }
  .order .intro { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; font-size: .9rem; color: var(--muted); margin-bottom: 14px; }
  .phase { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px 6px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .phase h2 { margin: 0 0 4px; font-size: 1rem; display: flex; align-items: baseline; gap: 10px; }
  .phase h2 .num { color: var(--accent); font-weight: 700; }
  .phase .pi { color: var(--muted); font-size: .85rem; margin: 0 0 8px; }
  .items { list-style: none; padding: 0; margin: 0; }
  .items li { padding: 6px 0 6px 12px; border-left: 2px solid var(--line); margin: 4px 0 4px 6px; }
  .items li .it { font-weight: 600; font-size: .9rem; }
  .items li .tx { color: var(--muted); font-size: .82rem; margin-top: 2px; }
  .items li.deep .it { font-weight: 500; }
  .items .links { display: inline-flex; gap: 5px; flex-wrap: wrap; margin-left: 6px; vertical-align: middle; }
  .cardlink { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); font-size: .74rem; }
  .cardlink:hover { border-color: var(--accent); }
  .dref { color: var(--muted); font-size: .72rem; margin-left: 4px; cursor: help; border-bottom: 1px dotted var(--muted); }

  /* Map */
  .mapwrap { position: relative; height: calc(100vh - 215px); min-height: 440px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .mapwrap svg { width: 100%; height: 100%; display: block; cursor: grab; user-select: none; }
  .mapwrap svg.grabbing { cursor: grabbing; }
  .mapwrap .legend { position: absolute; left: 10px; bottom: 10px; background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: .74rem; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
  .mapwrap .ctl { position: absolute; right: 10px; top: 10px; display: flex; gap: 6px; }
  .node { cursor: pointer; }
  .node rect.box { fill: var(--bg); stroke: var(--lane); stroke-width: 1.2; }
  .node:hover rect.box, .node.sel rect.box { stroke: var(--accent); stroke-width: 2; }
  .node text { font-size: 12px; fill: var(--ink); pointer-events: none; }
  .node text.sub { font-size: 10px; fill: var(--muted); }
  .node.faded { opacity: .22; }
  .edge { fill: none; stroke: var(--muted); stroke-opacity: .35; stroke-width: 1.3; }
  .edge.up { stroke: var(--accent); stroke-opacity: .95; stroke-width: 2; }
  .edge.down { stroke: var(--planned); stroke-opacity: .95; stroke-width: 2; }
  .edge.faded { stroke-opacity: .06; }
  .lanebg { fill: var(--lane); fill-opacity: .045; }
  .labelbg { fill: var(--panel); fill-opacity: .85; }
  .lanelabel { font-size: 11px; font-weight: 600; fill: var(--lane); letter-spacing: .04em; text-transform: uppercase; }
  .colhead { font-size: 11px; fill: var(--muted); }
  .colhead.now { fill: var(--in-flight); font-weight: 700; }
  .colline { stroke: var(--line); stroke-dasharray: 3 4; }

  /* Releases, Process, Health */
  .two { display: grid; grid-template-columns: minmax(300px, 1fr) minmax(300px, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 900px) { .two { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
  .panel h2 { font-size: 1rem; margin: 0 0 8px; }
  .panel h3 { font-size: .85rem; margin: 14px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .panel ul, .drawer ul { padding-left: 18px; margin: 4px 0; }
  .panel li, .drawer li { margin: 3px 0; font-size: .88rem; }
  .rel { display: grid; grid-template-columns: 90px 1fr; gap: 6px 12px; font-size: .88rem; }
  .rel .d { color: var(--muted); font-variant-numeric: tabular-nums; }
  .rel .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .flow { overflow-x: auto; }
  .flow svg { display: block; min-width: 900px; width: 100%; height: 190px; }
  .pnode rect { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; cursor: pointer; }
  .pnode.on rect, .pnode:hover rect { stroke: var(--accent); stroke-width: 2; }
  .pnode text { font-size: 12px; fill: var(--ink); pointer-events: none; }
  .pnode text.k { font-weight: 700; fill: var(--accent); font-size: 14px; }
  .parrow { stroke: var(--muted); stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  .parrow.side { stroke-dasharray: 4 4; }
  .pside { font-size: 11px; fill: var(--muted); }
  .health li.kind-stale { color: var(--in-flight); }
  table.cov { border-collapse: collapse; width: 100%; font-size: .82rem; }
  table.cov th, table.cov td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.cov th { color: var(--muted); font-weight: 600; }
  .ok { color: var(--released); } .no { color: var(--muted); }
  .log { font-size: .84rem; } .log li { margin: 6px 0; } .log time { color: var(--muted); font-size: .76rem; display: block; }

  /* Drawer */
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100vw); background: var(--panel); border-left: 1px solid var(--line); box-shadow: -8px 0 30px rgba(0,0,0,.12); overflow-y: auto; padding: 16px 18px 28px; transform: translateX(102%); transition: transform .18s ease; z-index: 20; }
  .drawer.open { transform: none; }
  .drawer .close { position: absolute; right: 10px; top: 8px; font-size: 1.3rem; color: var(--muted); padding: 4px 8px; }
  .drawer h2 { margin: 0 34px 6px 0; font-size: 1.1rem; line-height: 1.3; }
  .drawer .status { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: .78rem; font-weight: 600; color: #fff; background: var(--c); }
  .drawer .why { color: var(--muted); font-size: .8rem; margin: 6px 0 0; }
  .drawer h3 { font-size: .78rem; margin: 16px 0 5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .drawer p { margin: 4px 0; font-size: .9rem; }
  .drawer .row { display: flex; flex-wrap: wrap; gap: 6px; }
  .drawer .kv { display: grid; grid-template-columns: 90px 1fr; gap: 3px 10px; font-size: .85rem; }
  .drawer .kv span:first-child { color: var(--muted); }
  details summary { cursor: pointer; color: var(--muted); font-size: .82rem; }
  .dec { font-size: .82rem; margin: 3px 0; } .dec b { font-weight: 600; }
  @media (max-width: 720px) { header { padding: 10px 12px 0; } main { padding: 12px; } .tools input { width: 150px; } .mapwrap { height: 70vh; } }
</style>
</head>
<body>
<header>
  <div class="brand"><h1>Roadmap</h1><div class="meta" id="meta"></div></div>
  <nav class="tabs" id="tabs" aria-label="Views"></nav>
  <div class="tools">
    <input id="search" type="search" placeholder="Search steps, decisions, PRs…" aria-label="Search">
    <button class="btn" id="theme" title="Toggle light and dark">◐</button>
  </div>
</header>
<div class="stats" id="stats"></div>
<div class="filters" id="filters"></div>
<main id="main"></main>
<aside id="drawer" class="drawer" aria-label="Details"></aside>
<script src="data.js"></script>
<script>
(() => {
  const D = window.ROADMAP_DATA;
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  if (!D) {
    $('#main').innerHTML = '<div class="panel"><h2>No data yet</h2><p>Run <code>node tools/roadmap-canvas/extract.mjs</code> from the repository, then reload this page.</p></div>';
    return;
  }

  // ------------------------------------------------------------ data
  const SRC = D.sources || {}, OWNER = D.project?.owner || 'the owner', NAME = D.project?.name || 'The project';
  document.title = `${NAME} roadmap`; $('.brand h1').textContent = `${NAME} roadmap`;
  const cards = D.milestones;
  const byId = new Map(cards.map((c) => [c.id, c]));
  const lanes = new Map(D.lanes.map((l) => [l.id, l]));
  const STATUS = {
    released: { name: 'Released', color: 'var(--released)' },
    'on-dev': { name: 'Built, not released', color: 'var(--on-dev)' },
    'in-flight': { name: 'In flight', color: 'var(--in-flight)' },
    planned: { name: 'Planned', color: 'var(--planned)' },
    ongoing: { name: 'Ongoing', color: 'var(--ongoing)' },
    parked: { name: 'Parked', color: 'var(--parked)' },
    deferred: { name: 'Deferred', color: 'var(--deferred)' },
    later: { name: 'Later', color: 'var(--later)' },
  };
  const groupOf = (s) => (s === 'deferred' ? 'parked' : s);
  for (const c of cards) c.leadsTo = [];
  for (const c of cards) for (const id of c.after || []) byId.get(id)?.leadsTo.push(c.id);
  const seq = (a, b) => a.sequence - b.sequence;
  const repoUrl = D.repo.remote ? `https://github.com/${D.repo.remote}` : '';
  const docUrl = (file, anchor) => repoUrl ? `${repoUrl}/blob/dev/${file}${anchor ? '#' + anchor : ''}` : '';
  const fmtDate = (d) => d ? new Date(d + 'T12:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : '';
  const fmtDateTime = (d) => new Date(d).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });

  // ------------------------------------------------------------ state (in the URL hash)
  const VIEWS = [['board', 'Board'], ['order', 'Order of work'], ['map', 'Map'], ['releases', 'Releases'], ['process', 'How it works'], ['health', 'Health']];
  const state = { view: 'board', card: null, q: '', lanes: new Set(lanes.keys()), statuses: new Set(Object.keys(STATUS)), pnode: 'kyler' };
  function readHash() {
    const p = new URLSearchParams(location.hash.slice(1));
    if (p.get('view') && VIEWS.some(([v]) => v === p.get('view'))) state.view = p.get('view');
    state.card = p.get('card') && byId.has(p.get('card')) ? p.get('card') : null;
    state.q = p.get('q') || '';
  }
  function writeHash() {
    const p = new URLSearchParams();
    p.set('view', state.view);
    if (state.card) p.set('card', state.card);
    if (state.q) p.set('q', state.q);
    history.replaceState(null, '', '#' + p.toString());
  }
  readHash();
  $('#search').value = state.q;

  // ------------------------------------------------------------ matching (search and filters)
  function matches(c) {
    if (!state.lanes.has(c.lane) || !state.statuses.has(c.status)) return false;
    if (!state.q) return true;
    const q = state.q.toLowerCase();
    const hay = [c.id, c.title, c.summary, c.statusReason, (c.decisions || []).join(' '), (c.tags || []).map((t) => t.name).join(' '),
      (c.prs || []).map((p) => '#' + p.number + ' ' + (p.title || '')).join(' '), c.branch, (c.children || []).map((k) => k.title).join(' ')].join(' ').toLowerCase();
    return hay.includes(q);
  }
  const anyFilter = () => state.q || state.lanes.size !== lanes.size || state.statuses.size !== Object.keys(STATUS).length;

  // ------------------------------------------------------------ shared pieces
  const laneStyle = (c) => `--lane:${lanes.get(c.lane)?.color || '#888'}`;
  const statusDot = (s) => `<span class="dot" style="--c:${STATUS[s]?.color || '#888'}" title="${esc(STATUS[s]?.name || s)}"></span>`;
  const prChip = (p) => `<a class="tag pr" href="${esc(p.url)}" target="_blank" rel="noopener" title="${esc(p.title || '')}${p.state ? ' · ' + p.state.toLowerCase() + (p.isDraft ? ' draft' : '') : ''}"><span class="pr-dot pr-${p.isDraft && p.state === 'OPEN' ? 'draft' : esc(p.state || '')}"></span>#${p.number}</a>`;
  const cardLink = (id) => { const c = byId.get(id); return c ? `<button class="cardlink" data-card="${esc(id)}" style="${laneStyle(c)}">${statusDot(c.status)}${esc(shortTitle(c))}</button>` : ''; };
  const shortTitle = (c) => c.title.replace(/^(M\d+[ab]?)\.\s+/, '$1 · ');
  const decRef = (d) => { const t = D.decisions.byNumber[d]; return `<span class="dref" title="${esc(t ? t.topic + ': ' + t.text : 'Not in force (superseded or completed; see docs/archive/decisions.md)')}">${esc(d)}</span>`; };
  const decRefs = (ds, max = 8) => (ds || []).slice(0, max).map(decRef).join(' ') + ((ds || []).length > max ? `<span class="dref">+${ds.length - max}</span>` : '');

  function renderCardEl(c) {
    const tag = (c.tags || []).find((t) => t.exists) || (c.tags || [])[0];
    const faded = anyFilter() && !matches(c) ? ' faded' : '';
    const sel = state.card === c.id ? ' sel' : '';
    return `<button class="card${faded}${sel}" data-card="${esc(c.id)}" style="${laneStyle(c)}" title="${esc(lanes.get(c.lane)?.name || '')}">
      <div class="t">${statusDot(c.status)} ${esc(shortTitle(c))}</div>
      <div class="s">${esc(c.summary || c.statusReason || '')}</div>
      <div class="m">
        ${tag ? `<span class="tag" title="${tag.exists ? 'released ' + tag.date : 'the tag it will get'}">${tag.exists ? '🏷 ' : '○ '}${esc(tag.name)}${tag.exists ? ' · ' + fmtDate(tag.date) : ''}</span>` : ''}
        ${(c.prs || []).slice(0, 3).map(prChip).join('')}${(c.prs || []).length > 3 ? `<span class="tag">+${c.prs.length - 3} PRs</span>` : ''}
        ${(c.children || []).length ? `<span class="tag">${c.children.length} items</span>` : ''}
        ${(c.decisions || []).length ? `<span class="tag" title="${esc(c.decisions.join(', '))}">${c.decisions.length} D</span>` : ''}
      </div></button>`;
  }

  // ------------------------------------------------------------ header, stats, filters
  function renderChrome() {
    const g = D.github;
    $('#meta').innerHTML = `From <code>${esc(D.repo.branch)}@${esc(D.repo.commit)}</code> (${esc(D.repo.commitDate)}), generated ${esc(fmtDateTime(D.generatedAt))}${g.available ? ', with GitHub' : ', <span title="' + esc(g.note) + '">without GitHub</span>'}. Generator ${esc(D.repo.version)}.`;
    $('#tabs').innerHTML = VIEWS.map(([v, n]) => `<button data-view="${v}" class="${state.view === v ? 'on' : ''}">${n}</button>`).join('');
    const s = D.stats;
    const stat = (b, l, t = '') => `<div class="stat" title="${esc(t)}"><b>${esc(b)}</b><span>${esc(l)}</span></div>`;
    $('#stats').innerHTML = [
      stat(s.released, 'released', `Steps with a <step>${D.tagSuffix} tag`),
      stat(s['on-dev'], 'built, not released', 'Merged into dev, waiting for the next release'),
      stat(s['in-flight'], 'in flight', 'On a branch or being built now'),
      stat(s.planned, 'planned', 'In the order of work, not started'),
      stat((s.parked || 0) + (s.deferred || 0) + (s.later || 0), 'parked, deferred, later'),
      stat(s.decisionsInForce, `decisions in force · next ${s.nextDecision}`, '${SRC.decisionsLabel}'),
      stat(s.pendingOpen, `defaults waiting for ${OWNER} · next ${s.nextPending}`, '${SRC.pending}'),
      s.openPrs !== null ? stat(`${s.openPrs}`, `open PRs · ${s.openDraftPrs} drafts`, 'GitHub, at generation time') : '',
      stat(s.lastRelease ? fmtDate(s.lastRelease.date) : '—', `last release · ${s.lastRelease ? s.lastRelease.name : ''}`, 'The newest *-done tag'),
    ].join('');
    const showFilters = state.view === 'board' || state.view === 'map';
    $('#filters').innerHTML = !showFilters ? '' : `Lanes: ${D.lanes.map((l) => `<button class="chip ${state.lanes.has(l.id) ? '' : 'off'}" data-lane="${l.id}"><span class="dot" style="--c:${l.color}"></span>${esc(l.name)}</button>`).join('')}
      &nbsp; Status: ${Object.entries(STATUS).map(([k, v]) => `<button class="chip ${state.statuses.has(k) ? '' : 'off'}" data-status="${k}"><span class="dot" style="--c:${v.color}"></span>${v.name}</button>`).join('')}
      ${anyFilter() ? '<button class="chip" data-reset="1">reset</button>' : ''}`;
  }

  // ------------------------------------------------------------ views
  function renderBoard() {

  // The map: columns are time (release dates), then now, then the planned order; rows are lanes; arrows are what follows what.
  let mapView = null;
  function renderMap() {
    const NW = 176, NH = 40, GX = 46, GY = 8, LEFT = 150, TOP = 46, LANE_PAD = 16;
    const dates = [...new Set(cards.filter((c) => c.status === 'released' && c.releasedOn).map((c) => c.releasedOn))].sort();
    const cols = dates.map((d) => ({ key: d, label: fmtDate(d), kind: 'date' }));
    const nowCol = cols.push({ key: 'now', label: 'Now', kind: 'now' }) - 1;
    const planned = cards.filter((c) => c.status === 'planned').sort(seq);
    const plannedCol = new Map();
    planned.forEach((c, i) => { plannedCol.set(c.id, cols.length); cols.push({ key: 'p' + i, label: i === 0 ? 'Next, in order →' : '', kind: 'planned' }); });
    const tailCols = { ongoing: cols.push({ key: 'ongoing', label: 'Ongoing' }) - 1, parked: cols.push({ key: 'parked', label: 'Parked / deferred' }) - 1, later: cols.push({ key: 'later', label: 'Later' }) - 1 };
    const colOf = (c) => {
      if (c.status === 'released') return Math.max(0, dates.indexOf(c.releasedOn));
      if (c.status === 'on-dev' || c.status === 'in-flight') return nowCol;
      if (c.status === 'planned') return plannedCol.get(c.id);
      if (c.status === 'ongoing') return tailCols.ongoing;
      if (c.status === 'later') return tailCols.later;
      return tailCols.parked;
    };
    // Stack nodes per (lane, column); lane heights follow the tallest stack.
    const laneIds = D.lanes.map((l) => l.id);
    const cells = new Map();
    for (const c of [...cards].sort(seq)) { const k = c.lane + '|' + colOf(c); if (!cells.has(k)) cells.set(k, []); cells.get(k).push(c); }
    const laneRows = laneIds.map((id) => Math.max(1, ...[...cells.entries()].filter(([k]) => k.startsWith(id + '|')).map(([, v]) => v.length)));
    const laneTop = []; let y = TOP;
    laneRows.forEach((rows, i) => { laneTop[i] = y; y += LANE_PAD + rows * (NH + GY) + LANE_PAD - GY; });
    const totalH = y, totalW = LEFT + cols.length * (NW + GX);
    const pos = new Map();
    for (const [k, list] of cells) { const [lane, col] = k.split('|'); const li = laneIds.indexOf(lane); list.forEach((c, i) => pos.set(c.id, { x: LEFT + col * (NW + GX), y: laneTop[li] + LANE_PAD + i * (NH + GY) })); }
    const edges = [];
    for (const c of cards) for (const a of c.after || []) if (pos.has(a)) edges.push({ from: a, to: c.id });
    const path = (e) => { const s = pos.get(e.from), t = pos.get(e.to); const x1 = s.x + NW, y1 = s.y + NH / 2, x2 = t.x, y2 = t.y + NH / 2; const dx = Math.max(30, (x2 - x1) / 2); return x2 >= x1 ? `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}` : `M${x1},${y1} C${x1 + 40},${y1} ${x2 - 40},${y2} ${x2},${y2}`; };
    const trunc = (s, n) => s.length > n ? s.slice(0, n - 1) + '…' : s;
    const svg = `
      <g id="viewport">
        ${laneIds.map((id, i) => `<g style="--lane:${lanes.get(id).color}"><rect class="lanebg" x="0" y="${laneTop[i]}" width="${totalW}" height="${laneRows[i] * (NH + GY) + 2 * LANE_PAD - GY}"></rect></g>`).join('')}
        ${cols.map((col, i) => `<line class="colline" x1="${LEFT + i * (NW + GX) - GX / 2}" y1="${TOP - 10}" x2="${LEFT + i * (NW + GX) - GX / 2}" y2="${totalH}"></line><text class="colhead ${col.kind === 'now' ? 'now' : ''}" x="${LEFT + i * (NW + GX)}" y="${TOP - 18}">${esc(col.label)}</text>`).join('')}
        <text class="colhead" x="${LEFT}" y="16">Released, by date</text>
        <g id="edges">${edges.map((e) => `<path class="edge" data-from="${e.from}" data-to="${e.to}" d="${path(e)}"></path>`).join('')}</g>
        <g id="nodes">${cards.map((c) => { const p = pos.get(c.id); const faded = anyFilter() && !matches(c) ? ' faded' : ''; const sel = state.card === c.id ? ' sel' : '';
          return `<g class="node${faded}${sel}" data-card="${esc(c.id)}" transform="translate(${p.x},${p.y})" style="--lane:${lanes.get(c.lane).color}"><title>${esc(c.title)} — ${esc(STATUS[c.status]?.name || c.status)}</title>
            <rect class="box" width="${NW}" height="${NH}" rx="7"></rect><rect x="0" y="0" width="4" height="${NH}" rx="2" fill="${lanes.get(c.lane).color}"></rect>
            <circle cx="${NW - 12}" cy="12" r="5" fill="${STATUS[c.status]?.color || '#888'}"></circle>
            <text x="11" y="17">${esc(trunc(shortTitle(c), 25))}</text><text class="sub" x="11" y="31">${esc(trunc(c.status === 'released' ? ((c.tags || []).find((t) => t.exists)?.name || 'released') : (c.prs?.length ? c.prs.map((p) => '#' + p.number).slice(0, 3).join(' ') + (c.branch ? ' · ' + c.branch : '') : (c.branch || STATUS[c.status]?.name || '')), 30))}</text></g>`; }).join('')}</g>
      </g>
      <g id="lanelabels">${laneIds.map((id, i) => `<g style="--lane:${lanes.get(id).color}"><rect class="labelbg" x="0" y="${laneTop[i] + 6}" width="${LEFT - 24}" height="20" rx="4"></rect><text class="lanelabel" x="10" y="${laneTop[i] + 20}">${esc(lanes.get(id).name)}</text></g>`).join('')}</g>`;
    $('#main').innerHTML = `<p class="hint">Left to right: the released steps by date, then what is in flight now, then the planned steps in the roadmap's order; each row is a lane. Arrows show what a step follows. Hover a step to light what it waits for (orange) and what waits for it (blue); drag to pan, wheel to zoom.</p>
      <div class="mapwrap"><svg id="map" data-w="${totalW}" data-h="${totalH}" data-now="${LEFT + nowCol * (NW + GX)}">${svg}</svg>
      <div class="ctl"><button class="btn" id="fit">Fit</button><button class="btn" id="zin">+</button><button class="btn" id="zout">−</button></div>
      <div class="legend">${Object.entries(STATUS).filter(([k]) => k !== 'deferred').map(([k, v]) => `<span><span class="dot" style="--c:${v.color}"></span> ${v.name}</span>`).join('')}</div></div>`;
    wireMap();
  }
  function wireMap() {
    const svg = $('#map'), vp = $('#viewport');
    const W = +svg.dataset.w, H = +svg.dataset.h, NOW = +svg.dataset.now;
    const size = () => { const r = svg.parentElement.getBoundingClientRect(); svg.setAttribute('viewBox', `0 0 ${r.width} ${r.height}`); return r; };
    const r0 = size();
    const fit = () => { const r = size(); const k = Math.min(r.width / W, r.height / H, 1); mapView = { k, x: (r.width - W * k) / 2, y: 0 }; apply(); };
    const start = () => { const r = size(); const k = Math.max(.6, Math.min(1, (r.height - 8) / H)); mapView = { k, x: Math.min(0, r.width * .42 - NOW * k), y: 0 }; apply(); };
    const labels = $('#lanelabels');
    const apply = () => { vp.setAttribute('transform', `translate(${mapView.x},${mapView.y}) scale(${mapView.k})`); labels.setAttribute('transform', `translate(0,${mapView.y}) scale(${mapView.k})`); };
    if (!mapView) start(); else apply();
    window.addEventListener('resize', () => { if (state.view === 'map') size(); }, { passive: true });
    let drag = null;
    svg.addEventListener('pointerdown', (e) => { if (e.target.closest('.node')) return; drag = { x: e.clientX, y: e.clientY, ox: mapView.x, oy: mapView.y }; svg.classList.add('grabbing'); svg.setPointerCapture(e.pointerId); });
    svg.addEventListener('pointermove', (e) => { if (!drag) return; mapView.x = drag.ox + (e.clientX - drag.x); mapView.y = drag.oy + (e.clientY - drag.y); apply(); });
    svg.addEventListener('pointerup', () => { drag = null; svg.classList.remove('grabbing'); });
    svg.addEventListener('wheel', (e) => { e.preventDefault(); const r = svg.getBoundingClientRect(); const px = e.clientX - r.left, py = e.clientY - r.top; const f = e.deltaY < 0 ? 1.12 : 1 / 1.12; const k2 = Math.min(4, Math.max(.3, mapView.k * f)); mapView.x = px - (px - mapView.x) * (k2 / mapView.k); mapView.y = py - (py - mapView.y) * (k2 / mapView.k); mapView.k = k2; apply(); }, { passive: false });
    $('#fit').onclick = fit;
    $('#zin').onclick = () => { mapView.k = Math.min(4, mapView.k * 1.25); apply(); };
    $('#zout').onclick = () => { mapView.k = Math.max(.3, mapView.k / 1.25); apply(); };
    // Hover: ancestors (what it waits for) and descendants (what waits for it).
    const edgesEls = [...svg.querySelectorAll('.edge')], nodeEls = [...svg.querySelectorAll('.node')];
    const clear = () => { edgesEls.forEach((e) => e.classList.remove('up', 'down', 'faded')); nodeEls.forEach((n) => n.classList.remove('hl')); if (!anyFilter()) nodeEls.forEach((n) => n.classList.remove('faded')); };
    const walk = (id, dir, acc) => { const c = byId.get(id); for (const n of (dir === 'up' ? c.after || [] : c.leadsTo)) if (!acc.has(n)) { acc.add(n); walk(n, dir, acc); } return acc; };
    svg.addEventListener('pointerover', (e) => {
      const n = e.target.closest('.node'); if (!n) return;
      const id = n.dataset.card; const up = walk(id, 'up', new Set()), down = walk(id, 'down', new Set());
      const keep = new Set([id, ...up, ...down]);
      nodeEls.forEach((el) => el.classList.toggle('faded', !keep.has(el.dataset.card)));
      edgesEls.forEach((el) => { const a = el.dataset.from, b = el.dataset.to; const isUp = keep.has(b) && up.has(a) && (up.has(b) || b === id); const isDown = keep.has(a) && down.has(b) && (down.has(a) || a === id); el.classList.toggle('up', isUp); el.classList.toggle('down', isDown); el.classList.toggle('faded', !isUp && !isDown); });
    });
    svg.addEventListener('pointerout', (e) => { if (e.target.closest('.node') && !svg.contains(e.relatedTarget?.closest?.('.node'))) clear(); });
    svg.addEventListener('pointerleave', clear);
  }

          <li>${SRC.decisionsLabel}: ${D.stats.decisionsInForce} decisions in force across ${D.decisions.topics.length} topics; next ${D.stats.nextDecision}.</li>
          <li>git: ${D.tags.length} release tags; data from ${esc(D.repo.branch)}@${esc(D.repo.commit)} (dev at ${esc(D.repo.devCommit || '?')}).</li>
          <li>GitHub: ${D.github.available ? `${Object.keys(D.prs).length} pull requests, ${D.github.progressLogCount || 0} Progress log entries` : esc(D.github.note)}.</li>
        </ul></section>
      <section class="panel"><h2>Coverage</h2><p class="hint">Where each card's facts come from.</p><div style="overflow-x:auto"><table class="cov"><thead><tr><th>Card</th><th>Section</th><th>Tag</th><th>STATUS row</th><th>PRs</th><th>Status from</th></tr></thead><tbody>${cov}</tbody></table></div></section>
    </div>`;
  }

  // ------------------------------------------------------------ drawer
  function renderDrawer() {
    const el = $('#drawer');
    const c = state.card && byId.get(state.card);
    if (!c) { el.classList.remove('open'); el.innerHTML = ''; return; }
    const s = c.section, lane = lanes.get(c.lane);
    const list = (title, items) => items?.length ? `<h3>${title}</h3><ul>${items.map((i) => `<li>${esc(i)}</li>`).join('')}</ul>` : '';
    const rows = (c.statusRows || []).map((r) => `<div class="kv">${Object.entries(r.cells).filter(([k]) => k !== 'Work' && k !== 'Investigation').map(([k, v]) => `<span>${esc(k)}</span><span>${esc(v.replace(/[`*]/g, '').replace(/\[([^\]]*)\]\([^)]*\)/g, '$1'))}</span>`).join('')}</div>`).join('');
    const child = (k) => `<li>${k.cardId ? cardLink(k.cardId) : `<b>${esc(k.title)}</b>`}${k.prs?.length ? ' ' + k.prs.map(prChip).join(' ') : ''}${(k.cards || []).filter((id) => id !== c.id).map((id) => ' ' + cardLink(id)).join('')}${k.text && k.text !== k.title ? `<div class="hint" style="margin:2px 0 0">${esc(k.text.length > 260 ? k.text.slice(0, 260) + '…' : k.text)}</div>` : ''}</li>`;
    el.innerHTML = `<button class="close" aria-label="Close">×</button>
      <h2>${esc(c.title)}</h2>
      <div class="row"><span class="status" style="--c:${STATUS[c.status]?.color}">${esc(STATUS[c.status]?.name || c.status)}${c.releasedOn ? ' · ' + esc(fmtDate(c.releasedOn)) + (c.dateInferred ? ' (about)' : '') : ''}</span><span class="chip"><span class="dot" style="--c:${lane?.color}"></span>${esc(lane?.name || c.lane)}</span><span class="chip">${esc(c.kind)}</span></div>
      <p class="why">${esc(c.statusReason || '')}</p>
      ${c.summary ? `<p>${esc(c.summary)}</p>` : ''}
      ${c.statusNote && c.statusNote !== c.summary ? `<p class="hint">${esc(c.statusNote)}</p>` : ''}
      ${(c.tags || []).length ? `<h3>Tag</h3><div class="row">${c.tags.map((t) => `<span class="tag" title="${esc(t.subject || '')}">${t.exists ? '🏷 ' : '○ '}${esc(t.name)}${t.exists ? ' · ' + t.date : ' · not yet'}</span>`).join('')}</div>` : ''}
      ${rows ? `<h3>Where it stands (${SRC.status})</h3>${rows}` : ''}
      ${c.branch && !rows ? `<h3>Branch</h3><p><code>${esc(c.branch)}</code></p>` : ''}
      ${(c.prs || []).length ? `<h3>Pull requests</h3><div class="row">${c.prs.map((p) => `<span>${prChip(p)} <span class="hint">${esc(p.title || '')}</span></span>`).join('<br>')}</div>` : ''}
      ${s ? `${list('Delivers', s.delivers)}${list('Blocking', s.blocking)}${list('Information', s.information)}${s.effort || s.inGame ? `<div class="kv" style="margin-top:10px">${s.effort ? `<span>Effort</span><span>${esc(s.effort)}</span>` : ''}${s.inGame ? `<span>In-game check</span><span>${esc(s.inGame)}</span>` : ''}</div>` : ''}` : ''}
      ${c.orderText && c.orderText !== c.summary ? `<h3>In the order of work</h3><p>${esc(c.orderText)}</p>` : ''}
      ${(c.orderRefs || []).length ? `<h3>Place in the order</h3><ul>${c.orderRefs.map((r) => `<li>${r.phase}. ${esc(r.phaseTitle)}${r.trail.length ? ' › ' + esc(r.trail.join(' › ')) : ''}</li>`).join('')}</ul>` : ''}
      ${(c.children || []).length ? `<h3>Items (${c.children.length})</h3><ul>${c.children.map(child).join('')}</ul>` : ''}
      ${(c.after || []).length || c.leadsTo.length ? `<h3>Follows / leads to</h3><div class="row">${(c.after || []).map(cardLink).join('')}</div>${c.leadsTo.length ? `<p class="hint" style="margin:8px 0 4px">Leads to</p><div class="row">${c.leadsTo.map(cardLink).join('')}</div>` : ''}` : ''}
      ${(c.decisions || []).length ? `<h3>Decisions (${c.decisions.length})</h3><details><summary>${esc(c.decisions.slice(0, 12).join(', '))}${c.decisions.length > 12 ? '…' : ''}</summary>${c.decisions.map((d) => { const t = D.decisions.byNumber[d]; return `<p class="dec"><b>${esc(d)}</b> ${t ? `<span class="hint">${esc(t.topic)}</span><br>${esc(t.text)}` : '<span class="hint">not in force: superseded or completed (docs/archive/decisions.md)</span>'}</p>`; }).join('')}</details>` : ''}
      ${(c.mentionedPrs || []).length ? `<details style="margin-top:10px"><summary>Also mentioned: ${c.mentionedPrs.length} pull requests</summary><div class="row" style="margin-top:6px">${c.mentionedPrs.map(prChip).join('')}</div></details>` : ''}
      <h3>Read</h3><div class="row">${s && docUrl(s.file, s.anchor) ? `<a class="chip" href="${esc(docUrl(s.file, s.anchor))}" target="_blank" rel="noopener">${esc(s.file)} › ${esc(s.heading.length > 40 ? s.heading.slice(0, 40) + '…' : s.heading)}</a>` : ''}${docUrl(SRC.status) ? `<a class="chip" href="${esc(docUrl(SRC.status))}" target="_blank" rel="noopener">${esc(SRC.status)}</a>` : ''}${docUrl(SRC.decisions) ? `<a class="chip" href="${esc(docUrl(SRC.decisions, D.decisions.anchor))}" target="_blank" rel="noopener">${esc(SRC.decisionsLabel)}</a>` : ''}</div>`;
    el.classList.add('open');
  }

  // ------------------------------------------------------------ render and events
  const RENDERERS = new Map([['board', renderBoard], ['order', renderOrder], ['map', renderMap], ['releases', renderReleases], ['process', renderProcess], ['health', renderHealth]]);
  function render() {
    renderChrome();
    (RENDERERS.get(state.view) || renderBoard)();
    renderDrawer();
    writeHash();
  }
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-view],[data-card],[data-lane],[data-status],[data-reset],[data-pnode],.drawer .close');
    if (!t) return;
    if (t.dataset.view) { state.view = t.dataset.view; render(); }
    else if (t.dataset.card) { state.card = state.card === t.dataset.card && t.classList.contains('card') ? null : t.dataset.card; render(); }
    else if (t.dataset.lane) { const l = t.dataset.lane; if (e.shiftKey) { state.lanes = new Set([l]); } else state.lanes.has(l) ? state.lanes.delete(l) : state.lanes.add(l); render(); }
    else if (t.dataset.status) { const s = t.dataset.status; if (e.shiftKey) { state.statuses = new Set([s]); } else state.statuses.has(s) ? state.statuses.delete(s) : state.statuses.add(s); render(); }
    else if (t.dataset.reset) { state.q = ''; $('#search').value = ''; state.lanes = new Set(lanes.keys()); state.statuses = new Set(Object.keys(STATUS)); render(); }
    else if (t.dataset.pnode) { state.pnode = t.dataset.pnode; render(); }
    else if (t.classList.contains('close')) { state.card = null; render(); }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && state.card) { state.card = null; render(); } });
  let st; $('#search').addEventListener('input', (e) => { clearTimeout(st); st = setTimeout(() => { state.q = e.target.value.trim(); render(); }, 120); });
  $('#theme').addEventListener('click', () => { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; try { localStorage.setItem('rc-theme', r.dataset.theme); } catch {} });
  try { const t = localStorage.getItem('rc-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
  window.addEventListener('hashchange', () => { readHash(); render(); });
  render();
})();
</script>
</body>
</html>
