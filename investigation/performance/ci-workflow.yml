# Adoption example only: copy to .github/workflows in the milestone session.
# A headful, interactive, dedicated Windows GPU runner is required. Busy/software CI fails closed.
name: Terrain motion
on: [workflow_dispatch]
jobs:
  smoothness:
    runs-on: [self-hosted, Windows, terrain-performance]
    timeout-minutes: 1440
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: investigation/performance
      - run: node build.mjs before
        working-directory: investigation/performance
      - run: node build.mjs after
        working-directory: investigation/performance
      - run: node test.mjs
        working-directory: investigation/performance
      - run: node --test metrics.test.mjs audio-worklet.test.mjs window-policy.test.mjs
        working-directory: investigation/performance
      - run: node typecheck.mjs
        working-directory: investigation/performance
      - run: node verify.mjs
        working-directory: investigation/performance
      - run: node run.mjs --phase=before --repeats=3
        working-directory: investigation/performance
      - run: node run.mjs --phase=after --repeats=3
        working-directory: investigation/performance
      - run: node run.mjs --mode=capture --phase=before --repeats=3
        working-directory: investigation/performance
      - run: node run.mjs --mode=capture --phase=after --repeats=3
        working-directory: investigation/performance
      - run: node run.mjs --phase=after --cases=craterize-fast --hour --repeats=3
        working-directory: investigation/performance
      - run: node gate.mjs
        working-directory: investigation/performance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motion-evidence
          path: investigation/performance/local/runs
          retention-days: 7
