<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Glaciate · Dam Good Maps</title>
<link rel="stylesheet" href="/style.css"><body><header><div class="brand">DAM GOOD MAPS <span>/ field studies</span></div><div class="actions"><button id="undo">Undo</button><button id="redo">Redo</button><button id="sound" aria-pressed="true">Sound on</button><button id="save">Save study</button><button id="open">Open study</button><input id="file" type="file" accept=".json" hidden><button id="export">Download .timber</button></div></header>
<main><canvas id="land" aria-label="Glaciate terrain. Flow: click high ground. Aim: drag head to end." tabindex="0"></canvas><div class="top"><div class="title"><span class="eyebrow">FORCES / INVESTIGATION 05</span><h1>Glaciate</h1><p>A valley made for building.</p></div><select id="maps" aria-label="Map"></select></div>
<div class="toolbar"><label>Mode <select id="mode"><option value="flow">Flow</option><option value="aim">Aim</option></select></label><label>Power <input id="power" type="range" min="0" max="100" value="60"><output id="power-value">60</output></label><label>Size <input id="size" type="range" min="4" max="64" value="22"><output id="size-value">22</output><button id="auto" aria-pressed="true">Auto</button></label><label class="check"><input id="meltwater" type="checkbox" checked>Meltwater</label><button id="another">Try another</button></div>
<div id="pointer"></div><div class="bottom"><div><strong id="phase">Click high ground to gather ice</strong><p id="status">Flow follows the valley. Aim opens a pass through the ridge.</p></div><div><button id="top">Top view</button><button id="reset">Reset view</button><button id="motion" aria-pressed="true">Motion on</button></div></div><div id="loading">Loading real terrain…</div></main>
<script type="module" src="/app.ts"></script></body></html>
