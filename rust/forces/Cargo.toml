[package]
name = "forces"
description = "The forces of nature (Carve, Craterize, Erupt, Quake, Glaciate), the same bytes as the TypeScript they replaced"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "forces-batch"
path = "src/main.rs"

[dependencies]
portable = { path = "../portable" }
serde_json = { version = "=1.0.145", features = ["preserve_order", "float_roundtrip"] }
