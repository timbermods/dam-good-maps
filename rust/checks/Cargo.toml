[package]
name = "checks"
description = "The map checks (src/core/validate): verdicts and report, the same bytes as the TypeScript they replaced"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "checks-batch"
path = "src/main.rs"

[dependencies]
portable = { path = "../portable" }
analysis = { path = "../analysis", default-features = false, features = ["kernels"] }
