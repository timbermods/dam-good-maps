[package]
name = "water"
description = "The water simulation and its canonical settle, the same bytes as the TypeScript it replaced"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "water-batch"
path = "src/main.rs"

[dependencies]
portable = { path = "../portable" }
