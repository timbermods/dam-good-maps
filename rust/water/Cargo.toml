[package]
name = "water"
description = "The water simulation and its canonical settle, the same bytes as the TypeScript it replaced"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "water-batch"
path = "src/main.rs"

[dependencies]
portable = { path = "../portable" }

[features]
# The Wasm exports (lib.rs, stack_memory.rs). The forces crate links this crate without them, so its own module
# carries only its own exports when built on its own (-p), as tools/rust/build.ts and check.ts do.
default = ["exports"]
exports = []
