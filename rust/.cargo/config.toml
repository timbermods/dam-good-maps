# Strict floating point for native builds: no fused multiply-add, a fixed baseline CPU (PLAN §20 D401).
# Wasm needs no flags: wasm32-unknown-unknown has no FMA and no relaxed SIMD unless asked for.
# Windows binaries are linked without a timestamp, so the same source builds the same bytes (D465).
[build]
target-dir = "target"

[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "link-self-contained=yes", "-C", "target-feature=-fma", "-C", "target-cpu=x86-64-v2", "-C", "link-arg=-Wl,--no-insert-timestamp"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=-fma", "-C", "target-cpu=x86-64-v2", "-C", "link-arg=/Brepro"]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-feature=-fma", "-C", "target-cpu=x86-64-v2"]
